<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Signals</title>
<style>
:root{--bg:#f4f2ec;--panel:#fff;--ink:#1c1b18;--mute:#6f6b61;--line:#dedad0;--gold:#9a6f0b;--buy:#17824f;--sell:#c0392f;--wait:#6f6b61}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1b2029;--ink:#ece9e0;--mute:#9a978d;--line:#2c323d;--gold:#e0b04a;--buy:#4fbf8a;--sell:#ef6d63;--wait:#9a978d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font:600 22px/1.2 Georgia,serif;margin:4px 0 2px;color:var(--gold)}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--gold);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.sig{font:700 44px/1 Georgia,serif;margin:0}
.buy{color:var(--buy)}.sell{color:var(--sell)}.wait{color:var(--wait)}
.price{color:var(--mute);font-size:14px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lv div{border-top:2px solid var(--line);padding-top:6px}
.lv span{display:block;font-size:12px;color:var(--mute)}
.lv b{font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.row em{font-style:normal;font-weight:600}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);color:#fff;font:600 16px system-ui;cursor:pointer}
.btn:disabled{opacity:.6}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
.note{font-size:12px;color:var(--mute);margin-top:14px}
.err{color:var(--sell);font-size:14px}
.mini{display:flex;gap:8px}.mini div{flex:1;text-align:center;font-size:13px;color:var(--mute)}.mini b{display:block;font-size:16px}
</style>
</head>
<body>
<main>
<h1>Gold Signals</h1>
<p class="sub" id="stamp">XAU/USD · not analysed yet</p>

<div class="card" id="keybox" hidden>
  <b>Add your Twelve Data API key</b>
  <input id="keyin" placeholder="Paste API key" autocomplete="off">
  <button class="btn" id="savekey">Save key</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="out"></div>
<button class="btn" id="go">Analyse gold</button>
<p class="note">Signals come from indicators and can be wrong. This is not financial advice. Always use a stop loss and risk only a small part of your account.</p>
</main>

<script>
// ===== SETTINGS: edit these =====
const CONFIG = {
  API_KEY: '',                 // paste your Twelve Data key here, or enter it in the app
  SYMBOL: 'XAU/USD',           // gold symbol on the data provider
  TIMEFRAMES: ['15min','1h','4h'],
  SIGNAL_TF: '1h',             // timeframe shown first
  SL_ATR: 1.5,                 // stop loss distance in ATR
  TP_ATR: 3,                   // take profit distance in ATR (1:2 reward to risk)
  MIN_SCORE: 3                 // strategies that must agree (out of 5)
};
// ================================

const $ = id => document.getElementById(id);
const getKey = () => CONFIG.API_KEY || (()=>{try{return localStorage.getItem('tdkey')||''}catch(e){return ''}})();
let results = {}, active = CONFIG.SIGNAL_TF;

const ema = (a,p)=>{const k=2/(p+1);const o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
function rsi(c,p=14){let g=0,l=0;for(let i=1;i<=p;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=p;l/=p;
  for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}
  return l===0?100:100-100/(1+g/l)}
function atr(h,l,c,p=14){const tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  let a=tr.slice(0,p).reduce((x,y)=>x+y,0)/p;for(let i=p;i<tr.length;i++)a=(a*(p-1)+tr[i])/p;return a}

function analyse(d){
  const c=d.map(x=>+x.close),h=d.map(x=>+x.high),l=d.map(x=>+x.low),n=c.length,px=c[n-1];
  const e20=ema(c,20)[n-1],e50=ema(c,50)[n-1],e200=ema(c,200)[n-1];
  const m=ema(c,12).map((v,i)=>v-ema(c,26)[i]),sg=ema(m,9),hist=m[n-1]-sg[n-1];
  const r=rsi(c),a=atr(h,l,c);
  const hi20=Math.max(...h.slice(n-21,n-1)),lo20=Math.min(...l.slice(n-21,n-1));
  const votes=[
    ['Trend (EMA 20 vs 50)', e20>e50?1:-1],
    ['Long trend (price vs EMA 200)', px>e200?1:-1],
    ['Momentum (MACD)', hist>0?1:-1],
    ['RSI '+r.toFixed(0), r>70?-1:r<30?1:r>50?1:-1],
    ['20-bar breakout', px>=hi20?1:px<=lo20?-1:0]
  ];
  const score=votes.reduce((s,v)=>s+v[1],0);
  return {px,a,score,votes,support:Math.min(...l.slice(n-50)),resist:Math.max(...h.slice(n-50))};
}

function decide(tf){
  const r=results[tf]; if(!r) return null;
  let dir=r.score>=CONFIG.MIN_SCORE?1:r.score<=-CONFIG.MIN_SCORE?-1:0, why='';
  const big=results['4h'];
  if(dir&&big&&tf!=='4h'&&Math.sign(big.score)===-dir){dir=0;why='The 4-hour trend points the other way.'}
  return {dir,why,conf:Math.abs(r.score)/5};
}

const f=v=>v.toFixed(2);
function render(){
  $('tabs').innerHTML=CONFIG.TIMEFRAMES.map(t=>`<button class="${t===active?'on':''}" data-t="${t}">${t}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=b.dataset.t;render()});
  const r=results[active]; if(!r){$('out').innerHTML='';return}
  const s=decide(active),name=s.dir>0?'BUY':s.dir<0?'SELL':'NO TRADE',cls=s.dir>0?'buy':s.dir<0?'sell':'wait';
  let lv='';
  if(s.dir){const sl=r.px-s.dir*CONFIG.SL_ATR*r.a,tp=r.px+s.dir*CONFIG.TP_ATR*r.a;
    lv=`<div class="lv"><div><span>Entry</span><b>${f(r.px)}</b></div><div><span>Stop loss</span><b>${f(sl)}</b></div><div><span>Take profit</span><b>${f(tp)}</b></div></div>`}
  const mini=CONFIG.TIMEFRAMES.map(t=>{const d=decide(t);return d?`<div>${t}<b class="${d.dir>0?'buy':d.dir<0?'sell':'wait'}">${d.dir>0?'Buy':d.dir<0?'Sell':'Wait'}</b></div>`:''}).join('');
  $('out').innerHTML=`<div class="card"><p class="sig ${cls}">${name}</p>
    <p class="price">${active} chart · price ${f(r.px)} · ATR ${f(r.a)}</p>${s.why?`<p class="price">${s.why}</p>`:''}${lv}</div>
    <div class="card"><b>Confidence ${Math.round(s.conf*100)}%</b><div class="bar"><i style="width:${s.conf*100}%"></i></div>
    ${r.votes.map(v=>`<div class="row"><span>${v[0]}</span><em class="${v[1]>0?'buy':v[1]<0?'sell':'wait'}">${v[1]>0?'Buy':v[1]<0?'Sell':'Neutral'}</em></div>`).join('')}</div>
    <div class="card"><div class="mini">${mini}</div></div>
    <div class="card"><div class="row"><span>Support (last 50 bars)</span><em>${f(r.support)}</em></div><div class="row"><span>Resistance (last 50 bars)</span><em>${f(r.resist)}</em></div></div>`;
}

async function run(){
  const key=getKey(); if(!key){$('keybox').hidden=false;return}
  $('keybox').hidden=true;$('go').disabled=true;$('go').textContent='Analysing…';
  try{
    for(const t of CONFIG.TIMEFRAMES){
      const u=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(CONFIG.SYMBOL)}&interval=${t}&outputsize=300&apikey=${key}`;
      const j=await (await fetch(u)).json();
      if(j.status==='error'||!j.values)throw new Error(j.message||'No data returned');
      results[t]=analyse(j.values.slice().reverse());
    }
    $('stamp').textContent=CONFIG.SYMBOL+' · updated '+new Date().toLocaleTimeString();
    $('out').classList.remove('err');render();
  }catch(e){$('out').innerHTML=`<div class="card err">Could not load prices: ${e.message}</div>`}
  $('go').disabled=false;$('go').textContent='Analyse gold';
}
$('go').onclick=run;
$('savekey').onclick=()=>{const v=$('keyin').value.trim();if(v){try{localStorage.setItem('tdkey',v)}catch(e){}CONFIG.API_KEY=v;run()}};
if(!getKey())$('keybox').hidden=false;
</script>
</body>
</html>
